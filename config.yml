    cards:
      - id: cost
        prompt: I can't afford to wait
        emphasis: months for a website.
        icon: Rocket
        serviceTitle: Single-Page Sites at Your Pace
        body: Most agencies stretch builds across weeks of meetings and revisions. For
          our single-page sites, once you send your photos, wording, and logo,
          we work at your pace—not a rigid countdown. Need something live
          quickly? We'll move fast. Want time to review? No rush. Multi-page
          sites work the same way; we'll give you a clear timeline up front.
        href: /pricing
        cta: See starting prices
      - id: wordpress
        prompt: I'm worried about
        emphasis: WordPress getting hacked.
        icon: ShieldAlert
        serviceTitle: Hardened Static Architecture
        body: WordPress sites expose admin panels that bots hammer 24/7. Plugin stacks
          slow you down and break without warning. Halite builds compile to fast
          static assets with no /wp-admin to attack—clean, secure infrastructure
          you actually own.
        href: /services#framework
        cta: See how we build
      - id: facebook
        prompt: My business only has a
        emphasis: Facebook page.
        icon: Globe
        serviceTitle: Own Your Digital Real Estate
        body: Social platforms are rented land. Algorithms shift, pages get locked, and
          your competitors' paid ads show up right on your profile. A Halite
          site is permanent infrastructure on a domain you control—no
          distractions, no landlord.
        href: /services#why
        cta: See why ownership matters
      - id: mobile
        prompt: Most customers find me
        emphasis: on their phone.
        icon: Zap
        serviceTitle: Mobile-First Local Discovery
        body: Over 53% of local business discovery happens on mobile and map apps. If
          your site takes more than three seconds on cellular data, buyers
          bounce to the next result. We engineer for instant delivery,
          click-to-call, and directions routing.
        href: /services#framework
        cta: Explore the Halite method
      - id: pricing
        prompt: I don't know what
        emphasis: a website should cost.
        icon: Search
        serviceTitle: Transparent Starting Prices
        body: Quotes shouldn't feel like a mystery. We publish clear prices—from a
          single-page site to a full multi-page website—plus monthly payment
          options if you'd rather spread out the cost. Founding beta rates are
          available now.
        href: /pricing
        cta: View pricing tiers
      - id: apply
        prompt: I'm ready to
        emphasis: get started.
        icon: MessageCircle
        serviceTitle: Let's Talk About Your Project
        body: We partner with local owners who take their digital presence seriously.
          Share a few details and we'll schedule a focused discovery call—no
          hard sell, just a clear path from where you are to where you need to
          be.
        href: /apply
        cta: Let's chat
  confrontation:
    eyebrow: The real cost
    title: These are the problems that quietly cost local businesses customers.
    cards:
      - title: Rented space, zero ownership
        body: When your business home lives on Facebook or Instagram, you don't own the
          land. Platforms change rules overnight, lock accounts without warning,
          and surround your customers with ads for your direct competitors.
          Halite builds permanent digital real estate that belongs exclusively
          to you.
      - title: The three-second bounce
        body: More than half of local discovery happens on mobile and mapping apps. If
          your site crawls over cellular data, high-intent buyers tap the next
          result. We build sites that load quickly on phones—with easy
          tap-to-call and directions buttons built in.
      - title: The Google blindspot
        body: Customers ready to purchase search Google before they scroll social feeds.
          If your brand only exists inside a closed social environment, you're
          invisible to active local demand. We place your business exactly where
          buyers are already looking.
  framework:
    eyebrow: The Halite Method
    title: Curated structure. Your brand execution.
    paragraphs:
      - "We don't waste months coding from a blank page, and we don't install
        slow drag-and-drop page builders. Halite starts from proprietary
        structural frameworks—battle-tested layouts refined across dozens of
        local builds—then wraps them completely around your brand: your colors,
        photography, copy, and conversion goals."
      - The result is Next.js and Astro-class performance with Supabase-ready
        architecture when you need a data layer. No exposed admin panels for
        bots to target. No plugin roulette. Just a site that looks bespoke,
        loads dramatically faster than WordPress, and ships in a fraction of
        typical timelines.
    emphasis: That's how we deliver elite-quality sites at founding beta rates
      starting at $750—not by cutting corners, but by building smarter.
  localBusinessCta:
    title: Are you a local business?
    body: A short discovery call to map where you are today and what a static site
