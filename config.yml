  workflow:
    eyebrow: How we work
    title: From discovery to launch in three deliberate phases.
    steps:
      - step: "01"
        title: The 10-Minute Discovery Sync
        description: We audit your current digital footprint, evaluate local
          competition, and map a clean structural scope. No sales pitch—just
          strategy.
      - step: "02"
        title: The Crystalline Build Phase
        description: We compile your imagery, targeted sales copy, and localization data
          into our ultra-secure static framework engines.
      - step: "03"
        title: Domain Migration & Launch
        description: We help you configure secure domain ownership, point live traffic
          to global CDN delivery, and hand you infrastructure you control.
  differentiators:
    title: We're not your typical website designer.
    body: Halite WebDev is a student-founded studio building production static sites
      for local businesses. We combine agency-quality structure with the direct
      communication and accountability of working with the person who actually
      writes your code.
    link:
      label: Learn more about our process
      href: /process
    items:
      - title: Talk to real humans
        body: No ticket queues or offshore call centers. You work directly with the
          builder—clear answers, honest timelines, and real accountability.
        icon: Users
      - title: You matter to us
        body: We're a student-founded studio, not a volume agency. Every project gets
          focused attention because your reputation is ours too.
        icon: Heart
      - title: Don't worry, it's simple
        body: Three deliberate phases—from discovery to launch. We handle the technical
          heavy lifting so you can stay focused on running your business.
        icon: CheckCircle
      - title: Everything you need to succeed
        body: Design, performance, SEO foundations, and launch support in one cohesive
          build. No plugin patchwork or surprise upsells.
        icon: Layers
  pricing:
    eyebrow: Pricing
    title: Clear starting prices
    description: Straightforward options for restaurants, tattoo shops, salons, and
      local service businesses across Las Cruces, Albuquerque, Santa Fe, and El
      Paso. Every project starts with a free Zoom call—we confirm scope and
      price in writing before work begins.
