          gallery, about page, and contact—more room than a single scroll page.
        price: $1,650
        betaPrice: $1,250
        priceSuffix: one-time
        features:
          - 4–6 pages customized to your business
          - Full menu, portfolio, or gallery section
          - About page and contact page
          - Domain DNS connection once you share registrar access (you register
            the domain)
          - Google Search Console setup at launch
        cta:
          label: Start with a multi-page site
          href: /apply
        highlighted: true
    handoffHeading: After launch — your site files & ongoing care
    handoffIntro: Every project includes your finished site, domain connection at
      launch, and a ZIP of your files with written instructions. Choose how much
      live help you want after go-live—you can decide on the launch call.
    handoffOptions:
      - id: diy
        name: DIY Handoff
        description: Your site files and written instructions—no live session. You
          register the domain in your name; we connect DNS at launch.
        price: Free
        priceSuffix: ""
        features:
          - Complete site ZIP plus written redeploy and hosting instructions
          - You purchase and own the domain—we connect DNS at launch
          - Static HTML—no WordPress; any developer can host the ZIP elsewhere
          - No monthly subscription required
        highlighted: false
      - id: walkthrough
        name: Walkthrough Handoff
        description: Everything in DIY Handoff, plus a live 1-hour Zoom to walk through
          your domain, hosting, and site files.
        price: $60
        priceSuffix: one-time
        features:
          - 1-hour live Zoom after launch
          - Domain, hosting, and file export walkthrough
          - Complete site ZIP plus written instructions included
          - Ask questions in real time—recorded if you want
          - No monthly subscription required
        highlighted: false
      - id: managed
        name: Halite Care
        description: Same static site—you still register the domain in your name. We
          host it, connect DNS when you share access, and update content when
          you reach out.
        price: $150
        priceSuffix: / month
        features:
          - You purchase and own the domain; we configure DNS with your access
          - We host your static site—not WordPress, nothing to log into
          - SSL, security monitoring, and backups included
          - Menu, hours, and photo updates when you email or text
          - If you leave, we provide your site ZIP and handoff notes
        highlighted: true
    handoffNote: Registrars require the business owner (you) to purchase and hold
      the domain—Halite does not buy domains on your behalf or take legal
      ownership. A .com is usually about $12–$15 per year, paid directly to
      GoDaddy, Namecheap, Google Domains, or similar. You create the account,
      pay the registrar, then share login or DNS access so we can connect your
      site. Halite builds static sites, not WordPress—there is no wp-admin. DIY
      Handoff is included with every build. Walkthrough Handoff adds a live
      1-hour session. You pick DIY, Walkthrough, or Halite Care on the launch
      call.
    waasHeading: Website + hosting on a monthly plan
    waasNote: Spread the full project over 12 months with a small setup fee.
      Includes the static site build, hosting, and content updates. You register
      the domain in your name; we help connect DNS once you share registrar
      access.
    waasPlans:
      - id: waas-mono
        name: Single-Page Monthly Plan
        description: Full single-page site with a low setup fee and fixed monthly
          payment for 12 months. Build, hosting, and updates included.
        price: $149/mo
        betaPrice: $149
        priceSuffix: / month · 12 months
        setupFee: $250 setup
        features:
          - Full single-page site included
          - Hosting and DNS connection (you register the domain; we connect it)
          - Small content updates included
          - 12-month agreement
          - Zoom kickoff and launch call
        cta:
          label: Apply for single-page monthly
          href: /apply
      - id: waas-multi
        name: Multi-Page Monthly Plan
        description: The full multi-page website on a monthly plan—for businesses that
          want everything without a large upfront payment.
        price: $249/mo
        betaPrice: $249
        priceSuffix: / month · 12 months
        setupFee: $500 setup
        features:
          - Full multi-page site included
          - Hosting and DNS connection (you register the domain; we connect it)
          - Menu, hours, and photo updates included
          - 12-month agreement
          - Priority support at launch
        cta:
          label: Apply for multi-page monthly
          href: /apply
        highlighted: true
    addonsHeading: Optional add-ons
    addons:
      - name: English & Spanish Website
        price: $200 upfront
        description: Your key pages in both English and Spanish—a strong fit for El
          Paso, southern New Mexico, and borderland customers.
    testimonialNote: Founding clients who leave an honest Google review receive 10%
